x-common: &common
  env_file: .env
  environment: &environment
    DATABASE_PATH: /app/data/QLCC.db
    HOST: 0.0.0.0
    TZ: Asia/Ho_Chi_Minh
    AUTH_SERVICE_URL: http://auth:5001
    RESIDENT_SERVICE_URL: http://resident:5002
    BILLING_SERVICE_URL: http://billing:5003
    PARKING_SERVICE_URL: http://parking:5004
    MAINTENANCE_SERVICE_URL: http://maintenance:5005
    NOTIFICATION_SERVICE_URL: http://notification:5006
    COMPLAINT_SERVICE_URL: http://complaint:5007
    CHATBOT_SERVICE_URL: http://chatbot:5008
  volumes:
    - qlcc-data:/app/data
  restart: unless-stopped
  networks: [qlcc]
  depends_on:
    db-init:
      condition: service_completed_successfully
services:
  db-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/QLCC.db
    volumes:
      - qlcc-data:/app/data
      - ./data:/seed:ro
    networks: [qlcc]
    command: ["python", "-c", "from scripts.init_db import initialize; initialize(demo=True)"]
  auth:
    <<: *common
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports: ["127.0.0.1:5001:5001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
  resident:
    <<: *common
    build:
      context: .
      dockerfile: resident-service/Dockerfile
    ports: ["127.0.0.1:5002:5002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
  billing:
    <<: *common
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    ports: ["127.0.0.1:5003:5003"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
  parking:
    <<: *common
    build:
      context: .
      dockerfile: parking-service/Dockerfile
    ports: ["127.0.0.1:5004:5004"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5004/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
  maintenance:
    <<: *common
    build:
      context: .
      dockerfile: maintenance-service/Dockerfile
    ports: ["127.0.0.1:5005:5005"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
  notification:
    <<: *common
    volumes:
      - qlcc-data:/app/data
      - ./secrets:/app/secrets:ro
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports: ["127.0.0.1:5006:5006"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5006/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
  complaint:
    <<: *common
    build:
      context: .
      dockerfile: complaint-service/Dockerfile
    ports: ["127.0.0.1:5007:5007"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5007/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
  chatbot:
    <<: *common
    build:
      context: .
      dockerfile: chatbot-service/Dockerfile
    ports: ["127.0.0.1:5008:5008"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5008/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
  gateway:
    <<: *common
    build:
      context: .
      dockerfile: gateway/Dockerfile
    # Serve the current workspace UI when editing in VS Code or Antigravity.
    volumes:
      - qlcc-data:/app/data
      - ./frontend:/app/frontend:ro
    ports: ["0.0.0.0:5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
networks:
  qlcc:
    driver: bridge
volumes:
  qlcc-data:
