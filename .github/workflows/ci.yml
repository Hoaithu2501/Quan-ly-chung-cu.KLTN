name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  tests:
    name: Backend and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Check repository content
        run: python scripts/ci/check_repository.py
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
          python -m playwright install --with-deps chromium
      - name: Build CSS and check JavaScript
        run: |
          npm run build:css
          node --check frontend/app.js
          node --check frontend/push.js
          node --check frontend/firebase-messaging-sw.js
          node --test tests/test_firebase_worker.cjs
      - name: Backend and integration tests
        run: python -m pytest tests --ignore=tests/test_browser.py -q --junitxml=test-results/backend.xml
      - name: Browser acceptance tests
        env:
          RUN_BROWSER_TESTS: '1'
        run: python -m pytest tests/test_browser.py -q --junitxml=test-results/browser.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: test-results/*.xml
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker build and smoke test
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: qlcc-ci
      APP_ENV_FILE: .runtime/ci.env
      IMAGE_PREFIX: qlcc-ci
      IMAGE_TAG: check
      GATEWAY_PORT: '15000'
      # Test the UI inside the image, not this checkout.
      FRONTEND_MOUNT: /tmp/frontend-not-mounted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-smoke
      - name: Upload Docker diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-diagnostics
          path: test-results/
          retention-days: 7

  required:
    name: CI required
    needs: [tests, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          TESTS: ${{ needs.tests.result }}
          DOCKER: ${{ needs.docker.result }}
        run: test "$TESTS" = success && test "$DOCKER" = success
