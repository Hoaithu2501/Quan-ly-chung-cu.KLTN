name: Build and smoke test Docker images
description: Test a separate Compose project using only synthetic data and test credentials.
runs:
  using: composite
  steps:
    - name: Prepare disposable configuration
      shell: bash
      run: |
        set -euo pipefail
        test "$COMPOSE_PROJECT_NAME" = "qlcc-ci"
        test "$APP_ENV_FILE" = ".runtime/ci.env"
        mkdir -p secrets
        python scripts/ci/write_test_env.py
        docker compose config --quiet
    - name: Build all ten images
      shell: bash
      run: docker compose build
    - name: Start isolated services
      shell: bash
      run: docker compose up --no-build -d --wait --wait-timeout 180
    - name: Check built application
      shell: bash
      run: docker compose exec -T gateway python - < scripts/ci/smoke.py
    - name: Save diagnostics on failure
      if: failure()
      shell: bash
      run: |
        mkdir -p test-results
        docker compose ps -a > test-results/compose-status.txt
        docker compose logs --no-color --tail 150 > test-results/compose.log 2>&1
    - name: Remove only the disposable CI stack
      if: always()
      shell: bash
      run: |
        test "$COMPOSE_PROJECT_NAME" = "qlcc-ci"
        test "$APP_ENV_FILE" = ".runtime/ci.env"
        docker compose down --volumes --remove-orphans
